<title>Yankee Stadium 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D stage; signage-style panels float over it (title + mode on top, notes + style rail at bottom). */
:root{
  --bg:#e6e9ed;
  --panel:rgba(250,250,247,.88);
  --ink:#141922;
  --muted:#586072;
  --line:rgba(20,25,34,.13);
  --navy:#1b2b4b;
  --navy-ink:#ffffff;
  --gold:#a5802f;
  --focus:#2f6fe0;
  --shadow:0 8px 28px rgba(12,18,30,.14);
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --panel:rgba(17,20,27,.86); --ink:#eef1f6; --muted:#9ba4b6; --line:rgba(255,255,255,.13);
    --navy:#cfdcf5; --navy-ink:#0d1424; --gold:#d8b45f; --focus:#7ba8ff; --shadow:0 8px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --panel:rgba(17,20,27,.86); --ink:#eef1f6; --muted:#9ba4b6; --line:rgba(255,255,255,.13);
  --navy:#cfdcf5; --navy-ink:#0d1424; --gold:#d8b45f; --focus:#7ba8ff; --shadow:0 8px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}

/* Scene backdrops belong to each visual style, so they stay fixed across light and dark themes. */
#stage{position:absolute;inset:0;transition:background .6s ease}
#stage[data-bg="day"]{background:radial-gradient(120% 95% at 50% 32%,#f5f7f9 0%,#dfe5ec 55%,#c6ced8 100%)}
#stage[data-bg="night"]{background:
  radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.7),transparent 60%),
  radial-gradient(1px 1px at 33% 9%,rgba(255,255,255,.55),transparent 60%),
  radial-gradient(1.5px 1.5px at 71% 14%,rgba(255,255,255,.6),transparent 60%),
  radial-gradient(1px 1px at 86% 26%,rgba(255,255,255,.5),transparent 60%),
  radial-gradient(1px 1px at 52% 6%,rgba(255,255,255,.5),transparent 60%),
  radial-gradient(110% 80% at 50% 38%,#1c2a46 0%,#0c1322 55%,#04060b 100%)}
#stage[data-bg="clay"]{background:radial-gradient(120% 95% at 50% 35%,#fdfcfa 0%,#eceae4 60%,#d9d5cd 100%)}
#stage[data-bg="wire"]{background:linear-gradient(180deg,#4b4f56 0%,#33363b 60%,#26282c 100%)}
#stage[data-bg="toy"]{background:linear-gradient(180deg,#bfe0f7 0%,#e2f0fb 58%,#f5f9fd 100%)}

#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#app[data-mode="explore"] #scene{cursor:grab}
#app[data-mode="explore"] #scene:active{cursor:grabbing}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

.topbar{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));
  left:calc(16px + env(safe-area-inset-left,0px));right:calc(16px + env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;pointer-events:none}
.topbar > *{pointer-events:auto}
.title{padding:12px 16px 12px;max-width:360px;min-width:0}
.eyebrow{margin:0 0 4px;font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(26px,3.6vw,38px);line-height:.95;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
h1 .rule{display:block;width:44px;height:3px;margin-top:8px;background:var(--gold);border-radius:2px}
.spec{margin:8px 0 0;display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{margin:8px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.5}

.mode{display:flex;gap:4px;padding:4px;align-items:center}
.mode button,.style-btn{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.mode button{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;padding:7px 12px;border-radius:8px;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.mode .reset{border-left:1px solid var(--line);border-radius:0 8px 8px 0;margin-left:2px;color:var(--ink)}
.mode button:hover:not([aria-pressed="true"]){color:var(--ink)}

.bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:10px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.bottom > *{pointer-events:auto}
.note{align-self:flex-start;max-width:420px;padding:12px 16px;min-width:0}
.note p{margin:0}
.note-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px!important}
.note-head strong{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.02em;text-transform:uppercase}
.note-head span{font-family:var(--font-mono);font-size:11px;color:var(--gold)}
#n-desc{font-size:14.5px;line-height:1.45;color:var(--ink)}
.hint{margin-top:8px!important;font-family:var(--font-mono);font-size:11px;color:var(--muted)}

.styles{overflow-x:auto;scrollbar-width:thin;-webkit-overflow-scrolling:touch;border-radius:12px}
.styles-row{display:flex;gap:8px;width:max-content;padding:2px}
.style-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:118px;padding:9px 13px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);text-align:left}
.style-btn .s-name{font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.style-btn .s-ref{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.style-btn[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:transparent}
.style-btn[aria-pressed="true"] .s-ref{color:inherit;opacity:.75}
.style-btn:hover:not([aria-pressed="true"]){border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.label{position:absolute;left:0;top:0;display:flex;align-items:center;will-change:transform}
.label.flip{flex-direction:row-reverse}
.label .txt{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;white-space:nowrap;
  font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;box-shadow:var(--shadow)}
.label .lead{width:44px;height:1.5px;background:var(--gold)}
.label .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(255,255,255,.75)}

.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:#44506a;pointer-events:none;text-align:center;padding:0 24px}

@media (max-width:640px){
  .title{padding:10px 12px;max-width:none;flex:1 1 220px}
  .spec{font-size:10.5px}
  .note{max-width:none;align-self:stretch;padding:10px 12px}
  #n-desc{font-size:13.5px}
  .style-btn{min-width:104px;padding:8px 11px}
  .label .txt{font-size:12px;padding:4px 7px}
  .label .lead{width:26px}
}
@media (prefers-reduced-motion: reduce){ #stage{transition:none} }
</style>

<div id="app" data-mode="showcase">
  <div id="stage" data-bg="day"></div>
  <canvas id="scene" role="img" aria-label="3D model of Yankee Stadium"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <div class="topbar">
    <header class="card title">
      <p class="eyebrow">3D study · The Bronx, New York</p>
      <h1>Yankee Stadium<span class="rule"></span></h1>
      <p class="spec"><span>Opened 2009</span><span>LF 318 ft</span><span>CF 408 ft</span><span>RF 314 ft</span></p>
      <p id="stats" class="stats" hidden></p>
    </header>
    <div class="mode card" role="group" aria-label="Camera mode">
      <button id="m-show" type="button" aria-pressed="true">Showcase</button>
      <button id="m-explore" type="button" aria-pressed="false">Explore</button>
      <button id="reset" type="button" class="reset" hidden>Reset view</button>
    </div>
  </div>

  <div class="bottom">
    <aside class="card note" aria-live="polite">
      <p class="note-head"><strong id="n-name">Daylight aerial</strong><span id="n-refs"></span></p>
      <p id="n-desc"></p>
      <p id="hint" class="hint" hidden>Drag to orbit · Pinch or scroll to zoom · Right-drag or two fingers to pan</p>
    </aside>
    <nav class="styles" aria-label="Visual style"><div class="styles-row" id="styles"></div></nav>
  </div>

  <div id="loading" class="loading">Building the ballpark…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
const app=document.getElementById('app');
const stage=document.getElementById('stage');
const canvas=document.getElementById('scene');
const loading=document.getElementById('loading');
const labelsEl=document.getElementById('labels');

if(!window.THREE){ loading.textContent='The 3D library did not load. Check your connection and reload the page.'; return; }
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); }
catch(e){ loading.textContent='This browser could not start WebGL, so the 3D view cannot run here.'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0x000000,0);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const maxAniso=renderer.capabilities.getMaxAnisotropy();
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const deg=Math.PI/180;
const lin=h=>new THREE.Color(h).convertSRGBToLinear();
const scene=new THREE.Scene();

/* ------------------------------------------------------------------
   1. The outfield-wall loop. Home plate sits at (0,0); the field runs
   toward -z. Foul lines are 45 degrees; the outfield is an arc that
   passes LF 318 ft, CF 408 ft and RF 314 ft (about 97, 124, 96 m).
------------------------------------------------------------------- */
const N=360;
const C=[0,-53.8];
const r2=Math.SQRT1_2;
const dL=[-r2,-r2], dR=[r2,-r2], nL=[-r2,r2], nR=[r2,r2];

function buildLoop(){
  const raw=[], hc=[0,-11.3], ha=25, RO=70.2;
  for(let a=45;a>-45;a-=3){const t=a*deg; raw.push([hc[0]+ha*Math.sin(t),hc[1]+ha*Math.cos(t)]);}
  for(let s=8;s<97;s+=3){const o=17-16*(s-8)/89; raw.push([s*dL[0]+o*nL[0],s*dL[1]+o*nL[1]]);}
  for(let a=258;a>102;a-=2){const t=a*deg; raw.push([C[0]+RO*Math.sin(t),C[1]+RO*Math.cos(t)]);}
  for(let s=97;s>8;s-=3){const o=17-16*(s-8)/89; raw.push([s*dR[0]+o*nR[0],s*dR[1]+o*nR[1]]);}
  const seg=[]; let total=0;
  for(let i=0;i<raw.length;i++){const a=raw[i],b=raw[(i+1)%raw.length],l=Math.hypot(b[0]-a[0],b[1]-a[1]); seg.push(l); total+=l;}
  let pts=[], si=0, acc=0;
  for(let k=0;k<N;k++){
    const target=k*total/N;
    while(si<seg.length-1 && acc+seg[si]<target){acc+=seg[si]; si++;}
    const a=raw[si], b=raw[(si+1)%raw.length], t=seg[si]?(target-acc)/seg[si]:0;
    pts.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]);
  }
  for(let pass=0;pass<2;pass++){
    pts=pts.map((p,i)=>{const a=pts[(i-1+N)%N],b=pts[(i+1)%N]; return [(a[0]+2*p[0]+b[0])/4,(a[1]+2*p[1]+b[1])/4];});
  }
  const phiOf=p=>Math.atan2(p[0]-C[0],p[1]-C[1])/deg;
  let iCF=0; pts.forEach((p,i)=>{ if(Math.abs(phiOf(p))>Math.abs(phiOf(pts[iCF]))) iCF=i; });
  pts=pts.slice(iCF).concat(pts.slice(0,iCF));
  const nrm=pts.map((p,i)=>{
    const a=pts[(i-1+N)%N], b=pts[(i+1)%N]; let tx=b[0]-a[0], tz=b[1]-a[1]; const l=Math.hypot(tx,tz); tx/=l; tz/=l;
    let n=[tz,-tx]; if(n[0]*(p[0]-C[0])+n[1]*(p[1]-C[1])<0) n=[-tz,tx]; return n;
  });
  return {pts,nrm,phi:pts.map(phiOf)};
}
const LOOP=buildLoop();
const P=LOOP.pts, NR=LOOP.nrm, PHI=LOOP.phi;
const REG=PHI.map(f=>Math.abs(f)<=112?0:Math.abs(f)<163?1:2); // 0 infield bowl, 1 bleachers, 2 center field
function pos(i,o,y){const p=P[i],n=NR[i]; return [p[0]+n[0]*o, y, p[1]+n[1]*o];}
function idxAtPhi(t){let best=0,bd=1e9; for(let i=0;i<N;i++){let d=Math.abs(((PHI[i]-t+540)%360)-180); if(d<bd){bd=d;best=i;}} return best;}
function runs(pred){const out=[];let s=-1;for(let i=0;i<N;i++){if(pred(i)){if(s<0)s=i;}else if(s>=0){out.push([s,i-1]);s=-1;}} if(s>=0)out.push([s,N-1]); return out;}
function smooth(arr,w){return arr.map((_,i)=>{let s=0;for(let k=-w;k<=w;k++)s+=arr[(i+k+N)%N];return s/(2*w+1);});}

const rawBo=REG.map(r=>r===0?58:r===1?26:30);
const bo=smooth(rawBo,8).map((v,i)=>Math.max(v,rawBo[i]));
const fh=smooth(REG.map(r=>r===0?30:20),8);
const st=smooth(REG.map(r=>r===0?46:r===1?15:0),8).map((v,i)=>REG[i]===1?15:v);
const fo=smooth(rawBo.map(v=>v+5),8).map((v,i)=>Math.max(v,bo[i]+4));
const plinthOff=smooth(fo,6).map(v=>v+22);

/* ------------------------------------------------------------------
   2. Textures, all drawn in code on canvases.
------------------------------------------------------------------- */
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c,repeat){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=maxAniso;if(repeat)t.wrapS=THREE.RepeatWrapping;return t;}

const FX={xmin:-80,zmin:-134,W:160};
function fieldTexture(){
  const S=2048,c=mk(S,S),x=c.getContext('2d'),k=S/FX.W;
  x.setTransform(k,0,0,k,-FX.xmin*k,-FX.zmin*k);
  x.fillStyle='#3d7a34'; x.fillRect(FX.xmin,FX.zmin,FX.W,FX.W);
  x.save(); x.rotate(Math.PI/4);
  for(let j=-45;j<45;j++){x.fillStyle=j%2?'rgba(255,255,255,.07)':'rgba(0,0,0,.05)'; x.fillRect(j*6,-280,6,560);}
  x.rotate(-Math.PI/2);
  for(let j=-45;j<45;j++){if(j%2){x.fillStyle='rgba(255,255,255,.05)'; x.fillRect(j*6,-280,6,560);}}
  x.restore();
  x.beginPath(); P.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])); x.closePath();
  x.lineWidth=9; x.strokeStyle='#a06c46'; x.stroke();
  const dirt='#b27b4f';
  x.fillStyle=dirt; x.beginPath(); x.moveTo(0,0); x.lineTo(-27.5,-27.5);
  x.arc(0,-18.44,29,Math.atan2(-9.06,-27.5),Math.atan2(-9.06,27.5),false); x.closePath(); x.fill();
  x.fillStyle='#46873b'; x.beginPath(); x.moveTo(0,-4.3); x.lineTo(15.6,-19.4); x.lineTo(0,-34.6); x.lineTo(-15.6,-19.4); x.closePath(); x.fill();
  x.fillStyle='rgba(255,255,255,.05)';
  for(let j=-3;j<3;j++){x.save();x.beginPath();x.moveTo(0,-4.3);x.lineTo(15.6,-19.4);x.lineTo(0,-34.6);x.lineTo(-15.6,-19.4);x.closePath();x.clip();x.fillRect(j*5.2,-40,2.6,40);x.restore();}
  x.fillStyle=dirt; x.beginPath(); x.arc(0,0,3.96,0,Math.PI*2); x.fill();
  x.fillStyle='#b9845a'; x.beginPath(); x.arc(0,-18.44,2.74,0,Math.PI*2); x.fill();
  [[-12.02,-2.12],[12.02,-2.12]].forEach(p=>{x.fillStyle='#2f6a2b';x.beginPath();x.arc(p[0],p[1],1.3,0,Math.PI*2);x.fill();});
  x.strokeStyle='#f4f4ef'; x.lineWidth=.15;
  [dL,dR].forEach(d=>{x.beginPath();x.moveTo(0,0);x.lineTo(d[0]*99,d[1]*99);x.stroke();});
  x.lineWidth=.08; x.strokeRect(-1.6,-.92,1.2,1.84); x.strokeRect(.4,-.92,1.2,1.84);
  x.fillStyle='#f7f7f2';
  [[19.4,-19.4],[0,-38.8],[-19.4,-19.4]].forEach(b=>{x.save();x.translate(b[0],b[1]);x.rotate(Math.PI/4);x.fillRect(-.19,-.19,.38,.38);x.restore();});
  x.beginPath(); x.moveTo(-.22,-.22); x.lineTo(.22,-.22); x.lineTo(.22,0); x.lineTo(0,.22); x.lineTo(-.22,0); x.closePath(); x.fill();
  x.fillRect(-.3,-18.52,.6,.16);
  return tex(c);
}

function facadeTexture(night){
  const w=256,h=768,c=mk(w,h),x=c.getContext('2d'),m=v=>h-v*25.6,px=v=>v*25.6;
  const cx=128,ow=5.6,oy0=4.2,spring=19.6,r=ow/2;
  function opening(pad){const L=cx-px(r+pad),R=cx+px(r+pad); x.beginPath(); x.moveTo(L,m(oy0-pad*.3)); x.lineTo(L,m(spring)); x.arc(cx,m(spring),px(r+pad),Math.PI,0,false); x.lineTo(R,m(oy0-pad*.3)); x.closePath();}
  if(!night){
    x.fillStyle='#d9ceb6'; x.fillRect(0,0,w,h);
    x.strokeStyle='rgba(110,90,60,.16)'; x.lineWidth=1;
    for(let v=3.2;v<27.4;v+=1.1){x.beginPath();x.moveTo(0,m(v)+.5);x.lineTo(w,m(v)+.5);x.stroke();}
    const g=x.createLinearGradient(0,0,w,0); g.addColorStop(0,'rgba(0,0,0,.11)'); g.addColorStop(.12,'rgba(0,0,0,0)'); g.addColorStop(.88,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.11)');
    x.fillStyle=g; x.fillRect(0,0,w,h);
    x.fillStyle='#8c877d'; x.fillRect(0,m(3.2),w,px(3.2));
    x.fillStyle='rgba(0,0,0,.2)'; x.fillRect(0,m(3.2),w,3);
    x.fillStyle='#c4b79c'; opening(.45); x.fill();
    const gg=x.createLinearGradient(0,m(spring+r),0,m(oy0)); gg.addColorStop(0,'#3d4a5a'); gg.addColorStop(1,'#1e2630');
    x.fillStyle=gg; opening(0); x.fill();
    x.save(); opening(0); x.clip(); x.strokeStyle='#6c7787'; x.lineWidth=3;
    for(let v=oy0+3.4;v<spring+r;v+=3.4){x.beginPath();x.moveTo(0,m(v));x.lineTo(w,m(v));x.stroke();}
    x.beginPath(); x.moveTo(cx,0); x.lineTo(cx,h); x.stroke();
    x.fillStyle='rgba(255,255,255,.07)'; x.beginPath(); x.moveTo(cx-px(r),m(8)); x.lineTo(cx-px(r),m(14)); x.lineTo(cx+px(r),m(20)); x.lineTo(cx+px(r),m(14)); x.closePath(); x.fill();
    x.restore();
    x.fillStyle='rgba(0,0,0,.22)'; x.fillRect(0,m(27.4),w,4);
    x.fillStyle='#c6b99f'; x.fillRect(0,m(28.2),w,px(.8));
    x.fillStyle='#e6dcc8'; x.fillRect(0,0,w,px(.45));
  } else {
    x.fillStyle='#000'; x.fillRect(0,0,w,h);
    const up=x.createLinearGradient(0,m(0),0,m(16)); up.addColorStop(0,'rgba(255,190,120,.34)'); up.addColorStop(1,'rgba(255,190,120,0)');
    x.fillStyle=up; x.fillRect(0,0,w,h);
    const wg=x.createLinearGradient(0,m(spring+r),0,m(oy0)); wg.addColorStop(0,'#ffd892'); wg.addColorStop(1,'#ffae55');
    x.fillStyle=wg; opening(0); x.fill();

function quadAt(kb,i,oA,yA,oB,yB,k){band(kb,i,()=>[oA,yA],()=>[oB,yB],k);}

function tierProfile(t){
  const dO=(t.o1-t.o0)/t.steps, dH=(t.h1-t.h0)/(t.steps-1), fb=t.soffit?t.h0-t.fascia:0, bb=t.soffit?t.sb:0;
  return {dO,dH,fb,bb};
}
function tier(kb,run,t){
  const [a,b]=run, {dO,dH,fb,bb}=tierProfile(t);
  for(let i=a;i<b;i++){
    const aisle=(i%t.aisle)===0;
    for(let j=0;j<t.steps;j++){
      const y=t.h0+j*dH, oA=t.o0+j*dO, oB=oA+dO;
      quadAt(kb,i,oA,y,oB,y, j===t.walk?K.walk:aisle?K.aisle:K.seat);
      if(j>0) quadAt(kb,i,oA,y-dH,oA,y,K.riser);
    }
    quadAt(kb,i,t.o0,fb,t.o0,t.h0,K.fascia);
    quadAt(kb,i,t.o1,t.h1,t.o1,bb,K.back);
    if(t.soffit) quadAt(kb,i,t.o0,fb,t.o1,bb,K.soffit);
  }
  [a,b].forEach(i=>{
    const c=[[t.o0,fb],[t.o0,t.h0]];
    for(let j=0;j<t.steps;j++){const y=t.h0+j*dH,oB=t.o0+(j+1)*dO; c.push([oB,y]); if(j<t.steps-1) c.push([oB,y+dH]);}
    c.push([t.o1,bb]);

    faces.forEach(f=>kb.tri(pos(i,c[f[0]][0],c[f[0]][1]),pos(i,c[f[1]][0],c[f[1]][1]),pos(i,c[f[2]][0],c[f[2]][1]),K.cap));

}

function genStrip(idxs,offF,y0F,y1F,uScale){

    if(prev) u+=Math.hypot(b[0]-prev[0],b[2]-prev[2]); prev=b;
    Pp.push(...b,...t); U.push(u,0,u,1);
    if(n>0){const k=2*n; I.push(k-2,k,k-1,k-1,k,k+1);}

  for(let q=0;q<U.length;q+=2) U[q]/=sc;

  g.setAttribute('position',new THREE.Float32BufferAttribute(Pp,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));
  g.setIndex(I); g.computeVertexNormals();
  return g;
}

function recolor(kc){
  const cols=[]; for(const name in K) cols[K[name]]=lin(kc[name]);
  kindMeshes.forEach(m=>{const a=m.geometry.attributes.color, ks=m.userData.kinds;
    for(let v=0;v<ks.length;v++){const c=cols[ks[v]]; a.array[3*v]=c.r; a.array[3*v+1]=c.g; a.array[3*v+2]=c.b;}
    a.needsUpdate=true;});
}
function setMat(mat,hex,map){mat.color.copy(lin(hex)); if(map!==undefined && mat.map!==map){mat.map=map; mat.needsUpdate=true;}}
function glow(mat,hex,map,intensity){
  const on=!!hex; mat.emissive.copy(on?lin(hex):new THREE.Color(0)); const em=on?(map||null):null;
  if(mat.emissiveMap!==em){mat.emissiveMap=em; mat.needsUpdate=true;} mat.emissiveIntensity=intensity||1;
}
const LIGHTS={
  day:{hs:'#e3ecf7',hg:'#7f7666',hi:.8,sc:'#fff1dc',si:1.7,sp:[150,240,110],pl:0,cat:.18},

  clay:{hs:'#ffffff',hg:'#b8b2a8',hi:.9,sc:'#ffffff',si:1.25,sp:[-170,230,160],pl:0,cat:.22},
  wire:{hs:'#ffffff',hg:'#5c6066',hi:1.05,sc:'#ffffff',si:.75,sp:[150,240,110],pl:0,cat:0},
  toy:{hs:'#f2f8ff',hg:'#aebccc',hi:1,sc:'#ffffff',si:1.1,sp:[120,260,60],pl:0,cat:.12}

  edgeTargets.forEach(m=>{if(m.userData.edge) m.userData.edge.visible=on;});
}

  setMat(mats.cloud,'#ffffff');

  if(night){

    glow(mats.ribbon,'#ffffff',TX.ribbon,1.25); glow(mats.board,'#ffffff',TX.board,1.35);
    glow(mats.lights,'#fff4d6',null,2.6); glow(mats.letters,'#ffffff',TX.letters,.75);
  } else {
    glow(mats.facade); glow(mats.field); glow(mats.lights); glow(mats.letters);
    glow(mats.ribbon,pal.ribbonMap?'#ffffff':null,TX.ribbon,.35);
    glow(mats.board,pal.boardMap?'#ffffff':null,TX.board,.45);
  }
  setEdges(!!S.edges);

  document.getElementById('stats').hidden=!S.edges;
  document.getElementById('n-name').textContent=S.name;
  document.getElementById('n-refs').textContent=S.refs;
  document.getElementById('n-desc').textContent=S.desc;
  document.querySelectorAll('.style-btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.key===key)));
  if(mode==='showcase' || instant) goTo(preset(S),instant); else if((S.cam.type==='o')!==(cam===ortho)) goTo(preset(S),true);
}

/* camera presets + smooth moves */
let tw=null, mode='showcase';
function preset(S){
  const c=S.cam, aspect=Wd/Ht, tgt=new THREE.Vector3(...c.tgt);
  if(c.type==='o') return {type:'o',pos:new THREE.Vector3(...c.dir).normalize().multiplyScalar(600).add(tgt),tgt,size:c.size};
  const p=new THREE.Vector3(...c.pos);
  if(c.fit!==false){const k=Math.max(1,1.55/aspect); p.sub(tgt).multiplyScalar(k).add(tgt);}
  return {type:'p',pos:p,tgt,fov:c.fov};
}
function updateOrtho(){
  const aspect=Wd/Ht, halfH=aspect<1.25?orthoSize*1.25/aspect:orthoSize, halfW=halfH*aspect;
  ortho.left=-halfW; ortho.right=halfW; ortho.top=halfH; ortho.bottom=-halfH; ortho.updateProjectionMatrix();
}
function goTo(pr,instant){
  const wantOrtho=pr.type==='o', switching=wantOrtho!==(cam===ortho);
  if(wantOrtho){orthoSize=pr.size; updateOrtho();}
  const next=wantOrtho?ortho:persp;
  if(switching||instant||reduceMotion){
    cam=next; if(controls) controls.object=cam;
    cam.position.copy(pr.pos); target.copy(pr.tgt);
    if(!wantOrtho) persp.fov=pr.fov; cam.zoom=1; cam.updateProjectionMatrix(); cam.lookAt(target);
    if(controls) controls.target.copy(target);
    tw=null; return;
  }
  tw={t:0,dur:1.35,p0:cam.position.clone(),p1:pr.pos.clone(),t0:target.clone(),t1:pr.tgt.clone(),f0:persp.fov,f1:wantOrtho?persp.fov:pr.fov,z0:cam.zoom};
  tw.bump=Math.min(120,tw.p0.distanceTo(tw.p1)*.22);
}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* exploded-view labels */

  {g:'upper',p:pos(iA,46,40),t:'Grandstand · 400 level'},

function updateLabels(){
  const show=exploded && Math.abs(G.crown.position.y-EXP.crown)<12;
  labelsEl.hidden=!show; if(!show) return;
  LABELS.forEach(L=>{
    L.v.set(L.p[0],L.p[1]+G[L.g].position.y,L.p[2]).project(cam);
    const x=(L.v.x+1)/2*Wd, y=(1-L.v.y)/2*Ht, flip=x<Wd*.42;
    L.el.classList.toggle('flip',flip);
    L.el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(${flip?-5:5}px,-50%) translateX(${flip?'0':'-100%'})`;
  });
}

/* sizing */
function resize(){
  Wd=Math.max(1,app.clientWidth); Ht=Math.max(1,app.clientHeight);
  renderer.setSize(Wd,Ht,false); persp.aspect=Wd/Ht; persp.updateProjectionMatrix(); updateOrtho();
  if(mode==='showcase' && !tw) goTo(preset(STYLES[current]),true);
}
new ResizeObserver(resize).observe(app);
resize();
applyStyle('aerial',true);

/* render loop */
const clock=new THREE.Clock(); let fT=0,fN=0,fps=60,first=true;
const statsEl=document.getElementById('stats');
const fmt=n=>n.toLocaleString('en-US');
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.1);
  for(const k in G){const want=exploded?EXP[k]:0, g=G[k]; g.position.y=reduceMotion?want:g.position.y+(want-g.position.y)*Math.min(1,dt*4);}
  if(tw){
    tw.t+=dt/tw.dur; const e=tw.t>=1?1:ease(tw.t);
    cam.position.lerpVectors(tw.p0,tw.p1,e); cam.position.y+=Math.sin(Math.PI*e)*tw.bump;
    target.lerpVectors(tw.t0,tw.t1,e);
    if(cam===persp){persp.fov=tw.f0+(tw.f1-tw.f0)*e;} cam.zoom=tw.z0+(1-tw.z0)*e; cam.updateProjectionMatrix();
    cam.lookAt(target); if(controls) controls.target.copy(target);
    if(tw.t>=1) tw=null;
  } else if(controls && controls.enabled){ controls.update(); target.copy(controls.target); }
  else cam.lookAt(target);
  clouds.children.forEach((c,k)=>{c.position.x+=Math.sin(clock.elapsedTime*.2+k)*.02;});
  renderer.render(scene,cam);
  updateLabels();
  fT+=dt; fN++; if(fT>.5){fps=Math.round(fN/fT); fT=0; fN=0;
    if(STYLES[current].edges) statsEl.textContent=`[Perspective] [Edged faces]  Tris ${fmt(renderer.info.render.triangles)}  ·  Verts ${fmt(vertTotal)}  ·  ${fps} fps`;}
  if(first){first=false; loading.hidden=true;}
}
frame();
})();
