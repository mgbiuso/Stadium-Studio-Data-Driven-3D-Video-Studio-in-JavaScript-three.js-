<title>Stadium Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D stage; signage-style panels float over it (venue + title + mode on top, notes + style rail at bottom). */
:root{
  --bg:#e6e9ed;
  --panel:rgba(250,250,247,.9);
  --ink:#141922;
  --muted:#586072;
  --line:rgba(20,25,34,.13);
  --navy:#1b2b4b;
  --navy-ink:#ffffff;
  --gold:#a5802f;
  --focus:#2f6fe0;
  --shadow:0 8px 28px rgba(12,18,30,.14);
  --studio:#c8102e;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --panel:rgba(17,20,27,.88); --ink:#eef1f6; --muted:#9ba4b6; --line:rgba(255,255,255,.13);
    --navy:#cfdcf5; --navy-ink:#0d1424; --gold:#d8b45f; --focus:#7ba8ff; --shadow:0 8px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --panel:rgba(17,20,27,.88); --ink:#eef1f6; --muted:#9ba4b6; --line:rgba(255,255,255,.13);
  --navy:#cfdcf5; --navy-ink:#0d1424; --gold:#d8b45f; --focus:#7ba8ff; --shadow:0 8px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}

/* Scene backdrops belong to each visual style, so they stay fixed across light and dark themes. */
#stage{position:absolute;inset:0;transition:background .6s ease}
#stage[data-bg="day"]{background:radial-gradient(120% 95% at 50% 32%,#f5f7f9 0%,#dfe5ec 55%,#c6ced8 100%)}
#stage[data-bg="night"]{background:
  radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.7),transparent 60%),
  radial-gradient(1px 1px at 33% 9%,rgba(255,255,255,.55),transparent 60%),
  radial-gradient(1.5px 1.5px at 71% 14%,rgba(255,255,255,.6),transparent 60%),
  radial-gradient(1px 1px at 86% 26%,rgba(255,255,255,.5),transparent 60%),
  radial-gradient(1px 1px at 52% 6%,rgba(255,255,255,.5),transparent 60%),
  radial-gradient(110% 80% at 50% 38%,#1c2a46 0%,#0c1322 55%,#04060b 100%)}
#stage[data-bg="drawing"]{background:linear-gradient(180deg,#b9bcc0 0%,#a3a7ac 100%)}
#stage[data-bg="wire"]{background:linear-gradient(180deg,#4b4f56 0%,#33363b 60%,#26282c 100%)}
#stage[data-bg="toy"]{background:linear-gradient(180deg,#bfe0f7 0%,#e2f0fb 58%,#f5f9fd 100%)}
#stage[data-bg="road"]{background:radial-gradient(120% 95% at 50% 40%,#fbfbfb 0%,#eceeef 60%,#dcdfe2 100%)}
#stage[data-bg="studio"]{background:radial-gradient(110% 90% at 50% 42%,rgba(255,255,255,.14) 0%,rgba(0,0,0,0) 45%,rgba(0,0,0,.22) 100%),var(--studio)}
#stage[data-bg="tabletop"]{background:
  radial-gradient(18% 22% at 14% 12%,rgba(255,240,214,.9),transparent 70%),
  radial-gradient(14% 18% at 82% 8%,rgba(255,250,236,.75),transparent 70%),
  radial-gradient(20% 16% at 60% 4%,rgba(214,232,226,.6),transparent 70%),
  linear-gradient(180deg,#8a8579 0%,#b9b1a2 38%,#d9d1c2 70%,#c9bfae 100%)}
#stage[data-bg="pastel"]{background:linear-gradient(180deg,#f8d6c4 0%,#f4c4ad 100%)}
#stage[data-bg="white"]{background:radial-gradient(120% 95% at 50% 40%,#ffffff 0%,#f4f3f0 70%,#e9e7e2 100%)}
#stage[data-bg="blueprint"]{background-color:#f3f6f9;
  background-image:linear-gradient(rgba(31,78,140,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(31,78,140,.09) 1px,transparent 1px),
  linear-gradient(rgba(31,78,140,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(31,78,140,.05) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,24px 24px,24px 24px}

#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#app[data-style="tabletop"] #scene{filter:saturate(1.16) contrast(1.04)}
#app[data-mode="explore"] #scene{cursor:grab}
#app[data-mode="explore"] #scene:active{cursor:grabbing}

/* tilt-shift: blur the top and bottom of the frame so the model reads as a tiny physical object */
.tilt{position:absolute;left:0;right:0;pointer-events:none;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.tilt.top{top:0;height:44%;-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 30%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,#000 30%,transparent 100%)}
.tilt.bot{bottom:0;height:36%;-webkit-mask-image:linear-gradient(to top,#000 0%,#000 30%,transparent 100%);mask-image:linear-gradient(to top,#000 0%,#000 30%,transparent 100%)}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(110% 90% at 50% 50%,transparent 55%,rgba(40,28,14,.32) 100%)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

.topbar{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));
  left:calc(16px + env(safe-area-inset-left,0px));right:calc(16px + env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;pointer-events:none}
.topbar > *{pointer-events:auto}
.title{padding:10px 16px 12px;max-width:380px;min-width:0}
.venues{display:flex;gap:4px;margin:0 0 10px;padding:3px;border-radius:9px;background:var(--line);width:max-content;max-width:100%}
.venues button{font:inherit;cursor:pointer;border:0;background:none;color:var(--muted);font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:7px}
.venues button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.venues button:hover:not([aria-pressed="true"]){color:var(--ink)}
.eyebrow{margin:0 0 4px;font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(24px,3.4vw,36px);line-height:.95;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.rule{display:block;width:44px;height:3px;margin-top:8px;background:var(--gold);border-radius:2px}
.spec{margin:8px 0 0;display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{margin:8px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.5}

.mode{display:flex;gap:4px;padding:4px;align-items:center}
.mode button,.style-btn{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.mode button{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;padding:7px 12px;border-radius:8px;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.mode .reset{border-left:1px solid var(--line);border-radius:0 8px 8px 0;margin-left:2px;color:var(--ink)}
.mode button:hover:not([aria-pressed="true"]){color:var(--ink)}

.bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:10px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.bottom > *{pointer-events:auto}
.note{align-self:flex-start;max-width:440px;padding:12px 16px;min-width:0}
.note p{margin:0}
.note-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px!important}
.note-head strong{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.02em;text-transform:uppercase}
.note-head span{font-family:var(--font-mono);font-size:11px;color:var(--gold)}
#n-desc{font-size:14.5px;line-height:1.45;color:var(--ink)}
.hint{margin-top:8px!important;font-family:var(--font-mono);font-size:11px;color:var(--muted)}

.styles{overflow-x:auto;scrollbar-width:thin;-webkit-overflow-scrolling:touch;border-radius:12px}
.styles-row{display:flex;gap:8px;width:max-content;padding:2px}
.style-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:112px;padding:9px 13px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);text-align:left}
.style-btn .s-name{font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1;white-space:nowrap}
.style-btn .s-ref{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.style-btn[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:transparent}
.style-btn[aria-pressed="true"] .s-ref{color:inherit;opacity:.75}
.style-btn:hover:not([aria-pressed="true"]){border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.label{position:absolute;left:0;top:0;display:flex;align-items:center;will-change:transform}
.label.flip{flex-direction:row-reverse}
.label .txt{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;white-space:nowrap;
  font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;box-shadow:var(--shadow)}
.label .lead{width:40px;height:1.5px;background:var(--gold)}
.label .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(255,255,255,.75)}
#labels.blue .lead,#labels.blue .dot{background:#1f4e8c}

.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:#44506a;pointer-events:none;text-align:center;padding:0 24px}

@media (max-width:640px){
  .title{padding:10px 12px;max-width:none;flex:1 1 240px}
  .venues button{font-size:12px;padding:5px 8px}
  .spec{font-size:10.5px}
  .note{max-width:none;align-self:stretch;padding:10px 12px}
  #n-desc{font-size:13.5px}
  .style-btn{min-width:100px;padding:8px 11px}
  .label .txt{font-size:11.5px;padding:4px 7px}
  .label .lead{width:22px}
}
@media (prefers-reduced-motion: reduce){ #stage{transition:none} }
</style>

<div id="app" data-mode="showcase" data-style="aerial">
  <div id="stage" data-bg="day"></div>
  <canvas id="scene" role="img" aria-label="3D stadium model"></canvas>
  <div class="tilt top" id="tilt-top" hidden></div>
  <div class="tilt bot" id="tilt-bot" hidden></div>
  <div class="vignette" id="vignette" hidden></div>
  <div id="labels" aria-hidden="true"></div>

  <div class="topbar">
    <header class="card title">
      <div class="venues" role="group" aria-label="Venue">
        <button type="button" data-venue="yankee" aria-pressed="true">Yankee Stadium</button>
        <button type="button" data-venue="msg" aria-pressed="false">Madison Square Garden</button>
      </div>
      <p class="eyebrow" id="v-eyebrow"></p>
      <h1 id="v-name"></h1>
      <span class="rule"></span>
      <p class="spec" id="v-spec"></p>
      <p id="stats" class="stats" hidden></p>
    </header>
    <div class="mode card" role="group" aria-label="Camera mode">
      <button id="m-show" type="button" aria-pressed="true">Showcase</button>
      <button id="m-explore" type="button" aria-pressed="false">Explore</button>
      <button id="reset" type="button" class="reset" hidden>Reset view</button>
    </div>
  </div>

  <div class="bottom">
    <aside class="card note" aria-live="polite">
      <p class="note-head"><strong id="n-name"></strong><span id="n-refs"></span></p>
      <p id="n-desc"></p>
      <p id="hint" class="hint" hidden>Drag to orbit · Pinch or scroll to zoom · Right-drag or two fingers to pan</p>
    </aside>
    <nav class="styles" aria-label="Visual style"><div class="styles-row" id="styles"></div></nav>
  </div>

  <div id="loading" class="loading">Building the venues…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const app=$('app'), stage=$('stage'), canvas=$('scene'), loading=$('loading'), labelsEl=$('labels');

if(!window.THREE){ loading.textContent='The 3D library did not load. Check your connection and reload the page.'; return; }
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); }
catch(e){ loading.textContent='This browser could not start WebGL, so the 3D view cannot run here.'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0x000000,0);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.localClippingEnabled=true;
const maxAniso=renderer.capabilities.getMaxAnisotropy();
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const deg=Math.PI/180, TAU=Math.PI*2;
const lin=h=>new THREE.Color(h).convertSRGBToLinear();
const scene=new THREE.Scene();

/* =====================================================================
   Shared helpers: canvases, materials, geometry builders
===================================================================== */
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c,rs,rt){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=maxAniso;if(rs)t.wrapS=THREE.RepeatWrapping;if(rt)t.wrapT=THREE.RepeatWrapping;return t;}
const CLIP_ABOVE=[], CLIP_UNDER=[];
function std(o,clip){const m=new THREE.MeshStandardMaterial(Object.assign({roughness:.9,metalness:0},o)); if(clip==='under')CLIP_UNDER.push(m); else if(clip!==false)CLIP_ABOVE.push(m); return m;}

const stadMat=std({vertexColors:true,side:THREE.DoubleSide,flatShading:true});
const underMat=std({vertexColors:true,side:THREE.DoubleSide,flatShading:true},'under');
const mats={
  dark:std({}), accent:std({}), monument:std({}), lights:std({}), red:std({}),
  frieze:null,
  trunk:std({flatShading:true}), crown:std({flatShading:true}),
  cloud:std({flatShading:true,roughness:1},false),
  glass:std({color:lin('#d6ecf5'),transparent:true,opacity:.22,depthWrite:false,side:THREE.DoubleSide,roughness:.1}),
  road:std({},false), square:std({},false), soilTop:std({},false), soilSide:std({},false), soilDeep:std({color:lin('#4d4034')},false),
  plinthTop:std({},false), plinthSide:std({},false), woodTop:std({},false), woodSide:std({},false),
  trainEnd:std({color:lin('#9da3ab')},'under')
};
const K={seat:0,aisle:1,walk:2,riser:3,fascia:4,soffit:5,back:6,cap:7,canopy:8,roof:9,wall:10,wallTop:11,ground:12,mpark:13,inner:14,boards:15,cable:16,roofTop:17,slab:18,platform:19,track:20};

class KB{
  constructor(){this.p=[];this.k=[];}
  tri(a,b,c,k){this.p.push(a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2]); this.k.push(k,k,k);}
  quad(a,b,c,d,k){this.tri(a,b,c,k); this.tri(a,c,d,k);}
  mesh(V,group,mat){
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(this.p,3));
    g.setAttribute('color',new THREE.Float32BufferAttribute(new Float32Array(this.k.length*3),3));
    g.computeVertexNormals();
    const m=new THREE.Mesh(g,mat||stadMat); m.userData.kinds=Uint8Array.from(this.k);
    m.castShadow=m.receiveShadow=true; V.kindMeshes.push(m); V.edgeTargets.push(m); group.add(m); return m;
  }
}
function boxKB(kb,c,s,yaw,kTop,kSide,kBot){
  const sx=s[0]/2,sy=s[1]/2,sz=s[2]/2,cs=Math.cos(yaw||0),sn=Math.sin(yaw||0);
  const P=(x,y,z)=>[c[0]+x*cs+z*sn,c[1]+y,c[2]-x*sn+z*cs];
  const v=[P(-sx,-sy,-sz),P(sx,-sy,-sz),P(sx,sy,-sz),P(-sx,sy,-sz),P(-sx,-sy,sz),P(sx,-sy,sz),P(sx,sy,sz),P(-sx,sy,sz)];
  kb.quad(v[3],v[2],v[6],v[7],kTop); kb.quad(v[0],v[1],v[5],v[4],kBot===undefined?kSide:kBot);
  kb.quad(v[0],v[1],v[2],v[3],kSide); kb.quad(v[4],v[5],v[6],v[7],kSide); kb.quad(v[0],v[4],v[7],v[3],kSide); kb.quad(v[1],v[5],v[6],v[2],kSide);
}

/* A closed loop of points (the inner edge of the seating) with outward normals. */
function resample(raw,N){
  const seg=[]; let total=0;
  for(let i=0;i<raw.length;i++){const a=raw[i],b=raw[(i+1)%raw.length],l=Math.hypot(b[0]-a[0],b[1]-a[1]); seg.push(l); total+=l;}
  const pts=[]; let si=0,acc=0;
  for(let k=0;k<N;k++){
    const target=k*total/N;
    while(si<seg.length-1 && acc+seg[si]<target){acc+=seg[si]; si++;}
    const a=raw[si],b=raw[(si+1)%raw.length],t=seg[si]?(target-acc)/seg[si]:0;
    pts.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);
  }
  return pts;
}
function makeLoop(pts,C){
  const N=pts.length;
  const NR=pts.map((p,i)=>{const a=pts[(i-1+N)%N],b=pts[(i+1)%N]; let tx=b[0]-a[0],tz=b[1]-a[1]; const l=Math.hypot(tx,tz)||1; tx/=l; tz/=l;
    let n=[tz,-tx]; if(n[0]*(p[0]-C[0])+n[1]*(p[1]-C[1])<0) n=[-tz,tx]; return n;});
  const PHI=pts.map(p=>Math.atan2(p[0]-C[0],p[1]-C[1])/deg);
  const L={N,P:pts,NR,PHI,C};
  L.w=i=>((i%N)+N)%N;
  L.pos=(i,o,y)=>{i=L.w(i); const p=pts[i],n=NR[i]; return [p[0]+n[0]*o,y,p[1]+n[1]*o];};
  L.idxAtPhi=t=>{let best=0,bd=1e9; for(let i=0;i<N;i++){const d=Math.abs(((PHI[i]-t+540)%360)-180); if(d<bd){bd=d;best=i;}} return best;};
  L.runs=pred=>{const out=[];let s=-1;for(let i=0;i<N;i++){if(pred(i)){if(s<0)s=i;}else if(s>=0){out.push([s,i-1]);s=-1;}} if(s>=0)out.push([s,N-1]); return out;};
  L.smooth=(arr,w)=>arr.map((_,i)=>{let s=0;for(let k=-w;k<=w;k++)s+=arr[(i+k+N)%N];return s/(2*w+1);});
  L.cross=(axis,c,sign)=>{let best=0,bd=1e9; for(let i=0;i<N;i++){const p=pts[i],along=axis==='z'?p[1]:p[0],other=axis==='z'?p[0]:p[1]; if(Math.sign(other)!==sign) continue; const d=Math.abs(along-c); if(d<bd){bd=d;best=i;}} return best;};
  return L;
}
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r;};
function band(kb,L,i,fA,fB,k){const j=L.w(i+1),a=fA(i),b=fA(j),c=fB(j),d=fB(i); kb.quad(L.pos(i,a[0],a[1]),L.pos(j,b[0],b[1]),L.pos(j,c[0],c[1]),L.pos(i,d[0],d[1]),k);}
function quadAt(kb,L,i,oA,yA,oB,yB,k){band(kb,L,i,()=>[oA,yA],()=>[oB,yB],k);}

/* Stepped seating tier swept along the loop. o0/o1 may vary per index. */
function tier(kb,L,run,t){
  const f=v=>typeof v==='function'?v:()=>v, O0=f(t.o0), O1=f(t.o1), S=t.steps, dH=(t.h1-t.h0)/(S-1);
  const fb=t.soffit?t.h0-t.fascia:0, bb=t.soffit?t.sb:0;
  const prof=i=>{const o0=O0(i),o1=O1(i); return [o0,(o1-o0)/S,o1];};
  const [a,b]=run, end=t.closed?L.N:b;
  for(let i=a;i<end;i++){
    const j=L.w(i+1), A=prof(i), B=prof(j), aisle=(i%t.aisle)===0;
    const q=(oa,ya,ob,yb,oc,yc,od,yd,k)=>kb.quad(L.pos(i,oa,ya),L.pos(j,ob,yb),L.pos(j,oc,yc),L.pos(i,od,yd),k);
    for(let s=0;s<S;s++){

/* Vertical strip (facade, ribbons, frieze, letters). */
function genStrip(L,idxs,offF,y0F,y1F,uScale){
  const Pp=[],U=[],I=[]; let u=0,prev=null;
  idxs.forEach((i,n)=>{
    const o=offF(i),b=L.pos(i,o,y0F(i)),t=L.pos(i,o,y1F(i));
    if(prev) u+=Math.hypot(b[0]-prev[0],b[2]-prev[2]); prev=b;
    Pp.push(...b,...t); U.push(u,0,u,1);
    if(n>0){const k=2*n; I.push(k-2,k,k-1,k-1,k,k+1);}
  });
  const sc=uScale==='fit'?u:uScale; for(let q=0;q<U.length;q+=2) U[q]/=sc;
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(Pp,3));

}
/* Horizontal ring (the road). */
function genRing(L,idxs,inF,outF,y,uScale){
  const Pp=[],U=[],I=[]; let u=0,prev=null;
  idxs.forEach((i,n)=>{
    const a=L.pos(i,inF(i),y),b=L.pos(i,outF(i),y),m=[(a[0]+b[0])/2,(a[2]+b[2])/2];
    if(prev) u+=Math.hypot(m[0]-prev[0],m[1]-prev[1]); prev=m;
    Pp.push(...a,...b); U.push(u/uScale,0,u/uScale,1);
    if(n>0){const k=2*n; I.push(k-2,k,k-1,k-1,k,k+1);}
  });
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(Pp,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(U,2)); g.setIndex(I); g.computeVertexNormals(); return g;
}
function orient(L,idxs,outside){
  const m=Math.floor(idxs.length/2),i=L.w(idxs[m]),j=L.w(idxs[m+1]),n=L.NR[i];

const STYLES={

const ORDER=['aerial','night','bowl','overhead','exploded','wire','toy','road','studio','tabletop','pastel','cutaway','section'];
const CAMS={

let V=null, current='aerial', exploded=false;
const resolve=(v)=>typeof v==='function'?v(V):v;

function recolor(kc){
  const cols=[]; for(const n in K) cols[K[n]]=lin(kc[n]||'#cccccc');
  V.kindMeshes.forEach(m=>{const a=m.geometry.attributes.color,ks=m.userData.kinds; for(let v=0;v<ks.length;v++){const c=cols[ks[v]]; a.array[3*v]=c.r; a.array[3*v+1]=c.g; a.array[3*v+2]=c.b;} a.needsUpdate=true;});
}
function setMat(mat,hex,map){if(!mat)return; mat.color.copy(lin(hex)); if(map!==undefined && mat.map!==map){mat.map=map; mat.needsUpdate=true;}}
function glow(mat,hex,map,intensity){
  if(!mat) return; const on=!!hex; mat.emissive.copy(on?lin(hex):new THREE.Color(0)); const em=on?(map||null):null;
  if(mat.emissiveMap!==em){mat.emissiveMap=em; mat.needsUpdate=true;} mat.emissiveIntensity=intensity||1;
}
const edgeMats={above:new THREE.LineBasicMaterial({transparent:true}),under:new THREE.LineBasicMaterial({transparent:true})};
const EDGE_LOOK={wire:['#2a2d31',.75],ink:['#1d1f24',.5],blue:['#1f4e8c',.6]};
function setEdges(look){
  if(look && !V.edgesBuilt){V.edgeTargets.forEach(m=>{const under=m.material===underMat||CLIP_UNDER.includes(Array.isArray(m.material)?m.material[4]:m.material);
      const l=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,15),under?edgeMats.under:edgeMats.above); m.add(l); m.userData.edge=l;}); V.edgesBuilt=true;}
  if(look){const [c,o]=EDGE_LOOK[look]; Object.values(edgeMats).forEach(m=>{m.color.copy(lin(c)); m.opacity=o;});}
  V.edgeTargets.forEach(m=>{if(m.userData.edge) m.userData.edge.visible=!!look;});
}
function setClip(modeC){
  let above=[],under=[],inter=false;
  // three.js hides points on the negative side of a plane, so a normal of -x with constant c hides everything where x > c
  if(modeC==='quad'){above=[new THREE.Plane(new THREE.Vector3(-1,0,0),V.cut.x),new THREE.Plane(new THREE.Vector3(0,0,-1),V.cut.z)]; inter=true;}
  if(modeC==='half'){const s=V.section,p=new THREE.Plane(s.axis==='x'?new THREE.Vector3(-1,0,0):new THREE.Vector3(0,0,-1),s.c); above=[p]; under=[p];}
  const set=(m,pl)=>{m.clippingPlanes=pl; m.clipIntersection=inter; m.needsUpdate=true;};
  CLIP_ABOVE.forEach(m=>set(m,above)); set(edgeMats.above,above); CLIP_UNDER.forEach(m=>set(m,under)); set(edgeMats.under,under);
}

function applyStyle(key,instant){
  const S=STYLES[key], pal=PAL[S.pal], lightKey=resolve(S.light), Lt=LIGHTS[lightKey];
  current=key; exploded=!!S.explode; app.dataset.style=key;
  const kc=Object.assign({},PAL.day.k,pal.k);
  if(S.pal==='day') Object.assign(kc,V.dayK);
  if(S.pal==='studio') Object.assign(kc,{seat:V.studio.seat,fascia:V.studio.trim,wall:V.studio.trim,wallTop:V.studio.trim});
  recolor(kc);
  setMat(V.mats.field,pal.field,pal.fieldMap?V.tex.field:null);
  setMat(V.mats.facade,pal.facade,pal.facadeMap?V.tex.facade:null);
  setMat(V.mats.ribbon,pal.ribbon,pal.ribbonMap?V.tex.ribbon:null);
  setMat(V.mats.board,pal.board,pal.boardMap?V.tex.board:null);
  setMat(V.mats.marquee,pal.board,pal.boardMap?V.tex.marquee:null);
  setMat(mats.frieze,pal.frieze);
  ['dark','accent','monument','lights','red','trunk','crown'].forEach(n=>setMat(mats[n],pal[n]));
  setMat(mats.cloud,'#ffffff');
  setMat(mats.plinthTop,pal.plinth); setMat(mats.plinthSide,pal.plinth);
  setMat(mats.woodTop,'#7f9f58'); setMat(mats.woodSide,'#ffffff');
  setMat(mats.square,pal.plinth); setMat(mats.road,'#ffffff');
  setMat(mats.soilTop,pal.soilTop||PAL.day.soilTop); setMat(mats.soilSide,'#ffffff');
  (V.trainMats||[]).forEach(m=>setMat(m,pal.trainMap===false?'#c9cdd2':'#ffffff',pal.trainMap===false?null:m.userData.map));

  // what is visible
  V.plinth.visible=S.plinth!==false && !S.wood && !S.square;
  V.wood.visible=!!S.wood; V.square.visible=!!S.square;
  V.road.visible=!!S.road; V.roadHide.forEach(o=>o.visible=!S.road);
  V.trees.visible=pal.trees && S.trees!==false;
  V.soil.visible=S.soil==='cut'; V.soilHalf.visible=S.soil==='half';
  V.G.under.visible=!!(S.station && V.station);
  V.roofObjs.forEach(o=>o.visible=!!S.roof);
  if(V.sight) V.sight.visible=!!S.sight;
  V.letters.visible=pal.letters; clouds.visible=!!S.clouds;
  $('tilt-top').hidden=$('tilt-bot').hidden=$('vignette').hidden=!S.tilt;
  setEdges(S.edges||null); setClip(S.clip||null);

  // lights
  hemi.color.copy(lin(Lt.hs)); hemi.groundColor.copy(lin(Lt.hg)); hemi.intensity=Lt.hi;
  sun.color.copy(lin(Lt.sc)); sun.intensity=Lt.si; sun.position.set(V.center.x+Lt.sp[0],Lt.sp[1],V.center.z+Lt.sp[2]); sun.target.position.copy(V.center);
  const pp=V.pointPos[lightKey]||[]; pointLights.forEach((l,k)=>{if(pp[k]){l.position.set(...pp[k]); l.intensity=Lt.pl;} else l.intensity=0;});
  catcher.visible=Lt.cat>0; catcher.material.opacity=Lt.cat; catcher.position.set(V.center.x,S.wood?-9.4:-3.7,V.center.z);
  clouds.position.copy(V.center);
  const g=Lt.glow, M=V.mats;
  [M.facade,M.field,M.ribbon,M.board,M.letters,M.marquee,mats.lights].forEach(m=>glow(m));
  if(g==='night'){glow(M.facade,'#ffffff',V.tex.facadeNight,1); glow(M.field,'#ffffff',V.tex.field,V.indoor?.2:.55); glow(M.ribbon,'#ffffff',V.tex.ribbon,1.25); glow(M.board,'#ffffff',V.tex.board,1.35); glow(mats.lights,'#fff4d6',null,2.6); glow(M.letters,'#ffffff',V.tex.letters,.9); glow(M.marquee,'#ffffff',V.tex.marquee,1.5);}
  else if(g==='arena'){glow(M.field,'#ffffff',V.tex.field,.3); glow(M.ribbon,'#ffffff',V.tex.ribbon,1.3); glow(M.board,'#ffffff',V.tex.board,1.5); glow(M.marquee,'#ffffff',V.tex.marquee,1.2);}
  else if(g==='dusk'){glow(M.facade,'#ffffff',V.tex.facadeNight,.5); glow(M.ribbon,'#ffffff',V.tex.ribbon,.8); glow(M.board,'#ffffff',V.tex.board,1); glow(mats.lights,'#fff1cf',null,1.8); glow(M.letters,'#ffffff',V.tex.letters,.35); glow(M.marquee,'#ffffff',V.tex.marquee,1.1);}
  else if(g==='screens'){if(pal.ribbonMap) glow(M.ribbon,'#ffffff',V.tex.ribbon,.35); if(pal.boardMap){glow(M.board,'#ffffff',V.tex.board,.45); glow(M.marquee,'#ffffff',V.tex.marquee,.45);}}

  // backdrop, UI
  stage.dataset.bg=resolve(S.bg); app.style.setProperty('--studio',V.studio.bg);
  $('stats').hidden=!S.stats;
  $('n-name').textContent=S.name; $('n-refs').textContent=S.refs; $('n-desc').textContent=S.desc;
  document.querySelectorAll('.style-btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.key===key)));
  buildLabels(); labelsEl.classList.toggle('blue',key==='section');
  for(const k in V.G) if(instant||reduceMotion){V.G[k].position.copy(expOf(k));}
  if(mode==='showcase'||instant) goTo(preset(key),instant); else if((preset(key).type==='o')!==(cam===ortho)) goTo(preset(key),true);
}

/* cameras */
function preset(key){
  const c=Object.assign({},CAMS[key]||{},V.camOv[key]||{}), aspect=Wd/Ht;
  if(c.abs) return {type:'p',pos:new THREE.Vector3(...c.pos),tgt:new THREE.Vector3(...c.tgt),fov:c.fov};
  const s=V.scale, tgt=new THREE.Vector3(V.center.x+c.tgt[0]*s,c.tgt[1],V.center.z+c.tgt[2]*s);
  if(c.ortho){const dir=c.dir==='section'?(V.section.axis==='x'?[1,.14,.25]:[.25,.14,1]):c.dir; return {type:'o',pos:new THREE.Vector3(...dir).normalize().multiplyScalar(700).add(tgt),tgt,size:c.size*s};}
  const p=new THREE.Vector3(...c.off).multiplyScalar(s); const k=Math.max(1,Math.pow(1.55/aspect,.8)); p.multiplyScalar(k).add(tgt);
  return {type:'p',pos:p,tgt,fov:c.fov};
}
function updateOrtho(){const aspect=Wd/Ht,halfH=aspect<1.25?orthoSize*1.25/aspect:orthoSize; ortho.left=-halfH*aspect; ortho.right=halfH*aspect; ortho.top=halfH; ortho.bottom=-halfH; ortho.updateProjectionMatrix();}
function goTo(pr,instant){
  const wantO=pr.type==='o', switching=wantO!==(cam===ortho);
  if(wantO){orthoSize=pr.size; updateOrtho();}
  if(switching||instant||reduceMotion){
    cam=wantO?ortho:persp; if(controls) controls.object=cam;
    cam.position.copy(pr.pos); target.copy(pr.tgt); if(!wantO) persp.fov=pr.fov; cam.zoom=1; cam.updateProjectionMatrix(); cam.lookAt(target);
    if(controls) controls.target.copy(target); tw=null; return;
  }
  tw={t:0,dur:1.35,p0:cam.position.clone(),p1:pr.pos.clone(),t0:target.clone(),t1:pr.tgt.clone(),f0:persp.fov,f1:wantO?persp.fov:pr.fov,z0:cam.zoom};
  tw.bump=Math.min(120,tw.p0.distanceTo(tw.p1)*.22);
}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function expOf(k){const v=exploded?V.EXP[k]:0; return Array.isArray(v)?new THREE.Vector3(...v):new THREE.Vector3(0,v||0,0);}

/* labels */
let LBL=[], lblMode=null;
function buildLabels(){
  labelsEl.textContent=''; lblMode=current==='exploded'?'exploded':current==='section'?'section':null;
  LBL=lblMode?V.labels[lblMode].map(L=>{const el=document.createElement('div'); el.className='label'; el.innerHTML='<span class="txt"></span><span class="lead"></span><span class="dot"></span>'; el.querySelector('.txt').textContent=L.t; labelsEl.appendChild(el); return Object.assign({el,v:new THREE.Vector3()},L);}):[];
}
function updateLabels(){
  let show=!!lblMode && !tw;
  if(lblMode==='exploded') show=show && V.G.crown.position.distanceTo(expOf('crown'))<10;
  labelsEl.hidden=!show; if(!show) return;
  LBL.forEach(L=>{
    const off=L.g?V.G[L.g].position:new THREE.Vector3();
    L.v.set(L.p[0]+off.x,L.p[1]+off.y,L.p[2]+off.z).project(cam);
    const x=(L.v.x+1)/2*Wd,y=(1-L.v.y)/2*Ht, flip=lblMode==='section'?x>Wd*.5:x<Wd*.42;
    L.el.classList.toggle('flip',flip);
    L.el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(${flip?-5:5}px,-50%) translateX(${flip?'0':'-100%'})`;
  });
}

/* =====================================================================
   UI
===================================================================== */
const row=$('styles');
ORDER.forEach(k=>{
  const b=document.createElement('button'); b.type='button'; b.className='style-btn'; b.dataset.key=k; b.setAttribute('aria-pressed','false');
  b.innerHTML='<span class="s-name"></span><span class="s-ref"></span>'; b.querySelector('.s-name').textContent=STYLES[k].name; b.querySelector('.s-ref').textContent=STYLES[k].refs;
  b.addEventListener('click',()=>applyStyle(k)); row.appendChild(b);
});
const bShow=$('m-show'),bExp=$('m-explore'),bReset=$('reset'),hint=$('hint');
if(!controls) bExp.hidden=true;
function setMode(m){
  mode=m; app.dataset.mode=m;
  bShow.setAttribute('aria-pressed',String(m==='showcase')); bExp.setAttribute('aria-pressed',String(m==='explore'));
  bReset.hidden=m!=='explore'; hint.hidden=m!=='explore';
  if(controls){controls.enabled=m==='explore'; controls.target.copy(target);}
  if(m==='showcase') goTo(preset(current));
}
bShow.addEventListener('click',()=>setMode('showcase'));
bExp.addEventListener('click',()=>setMode('explore'));
bReset.addEventListener('click',()=>goTo(preset(current)));
function setVenue(key){
  if(V) V.root.visible=false;
  V=VENUES[key]; V.root.visible=true;
  $('v-eyebrow').textContent=V.eyebrow; $('v-name').textContent=V.name;
  const sp=$('v-spec'); sp.textContent=''; V.spec.forEach(t=>{const s=document.createElement('span'); s.textContent=t; sp.appendChild(s);});
  canvas.setAttribute('aria-label','3D model of '+V.name);
  document.querySelectorAll('.venues button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.venue===key)));
  applyStyle(current,true);
}
document.querySelectorAll('.venues button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.venue!==V.key) setVenue(b.dataset.venue);}));

/* build both venues, then start */
buildYankee(); buildMSG();
const vertCount=v=>{let n=0; v.root.traverse(o=>{if(o.isMesh&&o.geometry) n+=o.geometry.attributes.position.count*(o.isInstancedMesh?o.count:1);}); return n;};
Object.values(VENUES).forEach(v=>v.verts=vertCount(v));

function resize(){
  Wd=Math.max(1,app.clientWidth); Ht=Math.max(1,app.clientHeight);
  renderer.setSize(Wd,Ht,false); persp.aspect=Wd/Ht; persp.updateProjectionMatrix(); updateOrtho();
  if(V && mode==='showcase' && !tw) goTo(preset(current),true);
}
new ResizeObserver(resize).observe(app); resize();
setVenue('yankee');

const clock=new THREE.Clock(); let fT=0,fN=0,first=true;
const fmt=n=>n.toLocaleString('en-US');
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.1);
  for(const k in V.G){const want=expOf(k),g=V.G[k]; if(reduceMotion) g.position.copy(want); else g.position.lerp(want,Math.min(1,dt*4));}
  if(tw){
    tw.t+=dt/tw.dur; const e=tw.t>=1?1:ease(tw.t);
    cam.position.lerpVectors(tw.p0,tw.p1,e); cam.position.y+=Math.sin(Math.PI*e)*tw.bump; target.lerpVectors(tw.t0,tw.t1,e);
    if(cam===persp) persp.fov=tw.f0+(tw.f1-tw.f0)*e; cam.zoom=tw.z0+(1-tw.z0)*e; cam.updateProjectionMatrix(); cam.lookAt(target);
    if(controls) controls.target.copy(target); if(tw.t>=1) tw=null;
  } else if(controls && controls.enabled){controls.update(); target.copy(controls.target);}
  else cam.lookAt(target);
  if(clouds.visible) clouds.children.forEach((c,k)=>{c.position.x+=Math.sin(clock.elapsedTime*.2+k)*.02;});
  renderer.render(scene,cam);
  updateLabels();
  fT+=dt; fN++; if(fT>.5){const fps=Math.round(fN/fT); fT=0; fN=0;
    if(STYLES[current].stats) $('stats').textContent=`[Perspective] [Edged faces]  Tris ${fmt(renderer.info.render.triangles)}  ·  Verts ${fmt(V.verts)}  ·  ${fps} fps`;}
  if(first){first=false; loading.hidden=true;}
}
frame();
})();
