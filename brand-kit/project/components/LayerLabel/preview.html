<!-- @dsCard group="Design layer" height=220 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  body{margin:0;background:var(--night-900,#0b1220);font-family:"IBM Plex Mono",ui-monospace,monospace}
  .stage{position:relative;height:220px;overflow:hidden}
  .bld{position:absolute;right:40px;bottom:28px;width:210px;height:96px;border-radius:50%/40%;background:var(--navy,#1f3e70);border:2px solid var(--glow-cyan,#7ff6ff)}
  .t{position:absolute;left:32px;top:44px;font:700 30px/1.05 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.6px;color:var(--white,#fff);-webkit-text-stroke:0;text-shadow:0 0 3px var(--label-stroke,rgba(10,18,30,.62))}
  .s{position:absolute;left:32px;font-size:13.5px;line-height:21px;letter-spacing:.4px;color:var(--ink,#eef1f6)}
  svg{position:absolute;inset:0}
  .lead{fill:none;stroke:var(--white,#fff);stroke-width:1.4}
  .dot{fill:var(--white,#fff)}
</style></head>
<body><div class="stage">
  <div class="bld" aria-hidden="true"></div>
  <svg viewBox="0 0 640 220" preserveAspectRatio="xMinYMin meet" aria-hidden="true"><polyline class="lead" points="32,86 330,86 470,140"/><circle class="dot" cx="470" cy="140" r="4"/></svg>
  <div class="t">PENNSYLVANIA STATION</div>
  <div class="s" style="top:96px">OPENED NOV 27, 1910 · MCKIM, MEAD &amp; WHITE</div>
</div></body></html>
