<!-- @dsCard group="Design layer" height=150 -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;background:var(--night-900,#0b1220)}
  svg{display:block;width:100%;height:150px}
  .band{fill:none;stroke-width:7;opacity:.2;stroke-linecap:round}
  .core{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:14 16;animation:run 1.1s linear infinite}
  .rev{animation-direction:reverse}
  .c{stroke:var(--glow-cyan,#7ff6ff);filter:drop-shadow(0 0 4px var(--glow-cyan,#7ff6ff))}
  .g{stroke:var(--glow-gold,#ffd36b);filter:drop-shadow(0 0 4px var(--glow-gold,#ffd36b))}
  .head{fill:var(--glow-cyan,#7ff6ff)}
  @keyframes run{to{stroke-dashoffset:-30}}
  @media (prefers-reduced-motion:reduce){.core{animation:none}}
</style></head>
<body>
<svg viewBox="0 0 640 150" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Two glowing flow lines running in opposite directions, with a drop arrow">
  <path class="band c" d="M40 70 L600 70"/><path class="core c" d="M40 70 L600 70"/>
  <path class="band g" d="M40 100 L600 100"/><path class="core g rev" d="M40 100 L600 100"/>
  <path class="core c" d="M200 10 L200 58"/><path class="head" d="M200 66 L193 54 L207 54 Z"/>
</svg>
</body></html>
