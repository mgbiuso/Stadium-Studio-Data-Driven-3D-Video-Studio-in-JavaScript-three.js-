<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400&display=swap">
<style>
  html,body{margin:0;height:288px}
  body{background:var(--night-900,#0b1220);position:relative;overflow:hidden;width:960px}
  svg{position:absolute;left:0;top:0;width:960px;height:288px}
  .navy{fill:var(--navy,#1f3e70)} .cyan{fill:var(--glow-cyan,#7ff6ff)} .gold{fill:var(--glow-gold,#ffd36b)}
  .granite{fill:var(--granite,#d9c2b0)} .raised{fill:var(--line,#2a3346)}
  .blk{rx:var(--radius-md,8px)}
  .plus{stroke:var(--night-900,#0b1220);stroke-width:2;stroke-linecap:square}
  .txt{position:absolute;left:40px;bottom:32px;max-width:440px}
  .name{margin:0;font:700 96px/.95 "Barlow Condensed","Arial Narrow",Arial,sans-serif;color:var(--ink,#eef1f6);letter-spacing:.01em}
  .tag{margin:12px 0 0;font:400 14px/1.4 "Barlow",system-ui,sans-serif;color:var(--muted,#9ba4b6)}
</style></head>
<body>
<svg viewBox="0 0 960 288" aria-hidden="true">
  <!-- blocks: navy slab 224 x full height (space-8 x 7), glow-cyan 240 x 128, glow-gold 128 x 64, granite 96 x 144, night-800 128 x 64; corners radius-md
       arrangement: one tall slab with satellites, bleeding off the top, right and bottom, like a drafting sheet with its legend boxes
       pattern: a plus grid cut out of the navy slab, because the brand is a blueprint (measured, technical, mono numerals)
       steps and radii: grid pitch space-8 (32px), gaps space-4 (16px), corners radius-md -->

  <rect class="granite blk" x="864" y="144" width="104" height="152"/>
  <g class="plus">

</body></html>
